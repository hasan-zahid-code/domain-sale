<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Form</title>
</head>
<body>
  <!-- This file exists only so Netlify registers the form at build time. It is never shown to users. -->
  <form name="domain-offer" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="domain-offer" />
    <input type="number" name="price_offer_pkr" />
    <input type="text" name="first_name" />
    <input type="text" name="second_name" />
    <input type="email" name="email" />
    <input type="email" name="confirm_email" />
    <input type="tel" name="phone" />
    <textarea name="comment"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
